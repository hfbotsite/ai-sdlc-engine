name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Structural validation
        run: python tests/validate.py
      - name: Hook scripts syntax check
        run: |
          for f in ai-sdlc-engine/hooks/*.mjs; do
            node --check "$f"
          done
      - name: Hook smoke test
        run: |
          echo '{"source":"startup"}' | node ai-sdlc-engine/hooks/session-start.mjs | grep -q "TeamLead"
          echo '{"tool_name":"Bash"}' | node ai-sdlc-engine/hooks/tool-failure.mjs | grep -q "Diagnose"
